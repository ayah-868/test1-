<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign up</title>
    <link rel="stylesheet" href="./src/output.css">

</head>

<body>
    <header class="py-4 border border-charcoal ">
        <div class="container mx-auto flex items-center justify-between">

            <div class="logo">
                <a href="#">
                    <img src="./assest/img/logo.svg" />
                </a>
            </div>

            <div class="icon">
                <ul class="flex items-center gap-4">
                    <li>
                        <a href="#" class="text-gray text-xs">
                            Log In
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <img src="./assest/img/icons/shopping.svg" />
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <img src="./assest/img/icons/profile.svg" />
                        </a>
                    </li>
                </ul>

            </div>
        </div>
    </header>
    <hero>
        <section class="bg-background py-12 px-95">
            <div class="bg-white container mx-auto rounded-xl flex flex-col items-center p-12">
                <div class=" mb-8 text-center">
                    <h2 class="text-navy text-[32px] font-bold mb-2 font-playfair">Create Your Bookly Account</h2>
                    <p class="text-gray text-sm ">Join our community of modern readers and authors.</p>
                </div>
                <div>
                <form class="flex flex-col w-full">
                    <div class="flex flex-col mb-4">
                        <label class="text-xs text-gray mb-1 font-medium">Full Name</label>
                        <input type="text" placeholder="Enter your name"
                            class="border border-charcoal rounded-lg px-4 py-2.5 text-base focus:outline-none focus:border-navy" />
                    </div>
                    <div class="flex flex-col mb-4">
                        <label class="text-xs text-gray mb-1 font-medium">Email Address</label>
                        <input type="text" placeholder="name@example.com"
                            class="border border-charcoal rounded-lg px-4 py-2.5 text-base focus:outline-none focus:border-navy" />
                    </div>
                    <div class="flex flex-col mb-4">
                        <label class="text-xs text-gray mb-1 font-medium">Password</label>
                        <input type="password" placeholder="Min. 8 characters"
                            class="border border-charcoal rounded-lg px-4 py-2.5 text-base focus:outline-none focus:border-navy" />
                    </div>
                    <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="flex flex-col">
                        <label class="text-xs text-gray mb-1 font-medium">Date of Birth</label>
                        <input type="date" class="border border-charcoal rounded-lg px-3 py-2.5 text-base focus:outline-none focus:border-navy text-gray" />
                    </div>
                    <div class="flex flex-col">
                        <label class="text-xs text-gray mb-1 font-medium">Gender</label>
                        <select class="border border-charcoal rounded-lg px-3 py-2.5 text-base focus:outline-none focus:border-navy bg-white text-gray">
                            <option>male</option>
                            <option>female</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center gap-3 mb-6">
                    <input type="checkbox" id="terms" class="rounded border-charcoal  focus:ring-navy" />
    <label for="terms" class="text-xs text-gray">
        I agree to the 
        <a href="#" class="text-navy font-medium underline">Terms of Service</a> 
        and 
        <a href="#" class="text-navy font-medium underline">Privacy Policy</a>.
    </label>
                   </div>
<button type="submit" class="bg-navy text-white rounded-lg py-2.5 font-bold text-xl mb-6 hover:bg-navy/90 transition ">
                    Create Account
                </button>
                </form>
             <div class="relative flex items-center w-full mb-6">
                <div class="grow border-t border-charcoal"></div>
                <span class="shrink mx-4 text-xs text-gray uppercase">or</span>
                <div class="grow border-t border-charcoal"></div>
            </div>
            <button class="bg-orange text-brown flex items-center justify-center rounded-lg gap-2 py-2.5 mb-8 text-xl font-medium w-full px-[99.44px]">
                <img src="./assest/img/icons/Google.svg" class="mx-3.5"/>
                <span>Sign up with Google</span>
            </button>
            <p class="text-base text-gray text-center w-full">
                Already have an account?
                <span> <a href="#" class="text-navy font-bold hover:underline">Log in</a> </span>
            </p>
                </div>
            </div>
        </section>
    </hero>
</body>

</html>
